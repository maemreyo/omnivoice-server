[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnivoice-server"
version = "0.2.5"
description = "OpenAI-compatible HTTP server for OmniVoice TTS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "zamery", email = "matthew.ngo1114@gmail.com" }]

keywords = ["tts", "text-to-speech", "omnivoice", "openai", "fastapi", "voice-cloning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    # FIX: pin omnivoice to a compatible minor series.
    # OmniVoice is brand-new (April 2026) and its API may change in 0.2.x.
    # Widen this bound only after reviewing upstream changelogs.
    "omnivoice>=0.1.0,<0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "platformdirs>=3.0.0",
    "psutil>=6.0.0",
    "huggingface-hub>=0.26.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
formats = ["pydub>=0.25.0"]  # For mp3, opus, aac, flac support (also requires ffmpeg)
benchmark = ["psutil", "tqdm"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    # Keep torchcodec off Windows in the default dev extra.
    # Windows users can still opt in manually if they align torch/torchaudio/torchcodec.
    "torchcodec>=0.11; sys_platform != 'win32'",
]

[project.urls]
Homepage = "https://github.com/maemreyo/omnivoice-server"
Documentation = "https://github.com/maemreyo/omnivoice-server#readme"
Repository = "https://github.com/maemreyo/omnivoice-server"
Issues = "https://github.com/maemreyo/omnivoice-server/issues"
Changelog = "https://github.com/maemreyo/omnivoice-server/blob/main/CHANGELOG.md"

[project.scripts]
omnivoice-server = "omnivoice_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["omnivoice_server"]

# The source distribution otherwise carried ~20MB of audio: QA sample renders,
# a benchmark reference clip, and a 14MB mp3 attached to an old investigation.
# None of it is needed to build or install, and all of it is in git for anyone
# who wants it. Documentation prose stays — it is 652KB and the README links
# into it.
[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/samples",
    "/voice_samples",
    "**/*.wav",
    "**/*.mp3",
    "**/*.flac",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

# numpy >= 2.4 ships stubs using PEP 695 `type` statements, which mypy cannot
# parse under python_version = "3.10" — it aborts before checking our own code.
# The type-check job therefore runs on 3.10 itself (see ci.yml), which resolves
# a numpy old enough to still support 3.10. follow_imports_for_stubs keeps the
# skip below effective if a future numpy backports the syntax anyway;
# follow_imports alone does not apply to .pyi files.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["omnivoice_server"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__main__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 1
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
