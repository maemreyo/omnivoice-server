name: Publish to PyPI

# DISABLED ON THIS FORK.
#
# The PyPI name `omnivoice-server` belongs to the upstream project
# (maemreyo/omnivoice-server). This fork is installed from Git, not PyPI, so
# publishing from here would either fail on auth or collide with upstream's
# package. The `release: published` trigger was removed so that `make release`
# cannot fire it by accident.
#
# To re-enable: publish under a package name you own (rename `project.name` in
# pyproject.toml first), set the PYPI_API_TOKEN secret, then restore the
# `release:` trigger below.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
