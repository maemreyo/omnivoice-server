name: Build and Push Docker Images

# Manual-only on this fork: the `release: published` trigger was removed so
# `make release` cannot push images by accident. The image namespace follows
# whoever's Docker Hub credentials are configured (DOCKERHUB_USERNAME), rather
# than the hardcoded upstream namespace it used to use.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag (e.g., v0.2.0, latest)'
        required: false
        default: ''

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/omnivoice-server

jobs:
  push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            latest

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:cpu-latest
            ${{ github.event.inputs.tag != '' && format('{0}:{1}', env.IMAGE_NAME, github.event.inputs.tag) || '' }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:cuda-latest
            ${{ github.event.inputs.tag != '' && format('{0}:cuda-{1}', env.IMAGE_NAME, github.event.inputs.tag) || '' }}
            ${{ format('{0}:{1}-cuda', env.IMAGE_NAME, github.event.inputs.tag != '' && github.event.inputs.tag || 'latest') }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show pushed images
        run: |
          echo "✅ Pushed Docker images:"
          echo "  - ${{ env.IMAGE_NAME }}:latest"
          echo "  - ${{ env.IMAGE_NAME }}:cpu-latest"
          echo "  - ${{ env.IMAGE_NAME }}:cuda-latest"
          ${{ github.event.inputs.tag != '' && format('echo "  - {0}:{1}"', env.IMAGE_NAME, github.event.inputs.tag) || '' }}