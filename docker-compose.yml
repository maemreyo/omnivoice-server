services:
  omnivoice-server:
    image: ${OMNIVOICE_IMAGE:-ghcr.io/remominor/omnivoice-server:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnivoice-server
    ports:
      - "${OMNIVOICE_HOST_PORT:-8880}:8880"
    volumes:
      - profiles:/data/profiles
      - huggingface-cache:/cache/huggingface
    environment:
      OMNIVOICE_HOST: 0.0.0.0
      OMNIVOICE_PORT: 8880
      OMNIVOICE_DEVICE: cuda
      OMNIVOICE_MAX_CONCURRENT: ${OMNIVOICE_MAX_CONCURRENT:-1}
      OMNIVOICE_CUDA_TF32: ${OMNIVOICE_CUDA_TF32:-true}
      OMNIVOICE_FLASHINFER_MODE: ${OMNIVOICE_FLASHINFER_MODE:-false}
      OMNIVOICE_FLASHINFER_CUDA_GRAPH: ${OMNIVOICE_FLASHINFER_CUDA_GRAPH:-false}
      OMNIVOICE_LOW_VRAM_MODE: ${OMNIVOICE_LOW_VRAM_MODE:-false}
      OMNIVOICE_SPLIT_CFG_BATCH: ${OMNIVOICE_SPLIT_CFG_BATCH:-false}
      OMNIVOICE_API_KEY: ${OMNIVOICE_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m

volumes:
  profiles:
  huggingface-cache:
